<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>算法模板速查 | WeiKnight Notes</title>
    <meta name="description" content="面向 LeetCode 和面试刷题的 C++ 算法模板站。" />
    <link rel="icon" type="image/svg+xml" href="{{SITE_BASE_PATH}}notes-mark.svg" />
    <script src="assets/color-theme.js"></script>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body data-page="index" data-site-root="./">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{SITE_BASE_PATH}}"><img class="brand-mark" src="{{SITE_BASE_PATH}}notes-mark.svg" alt="" width="32" height="32" /><span>WeiKnight · Notes</span></a>
        <nav class="top-nav" aria-label="Notes navigation">
          <a href="{{SITE_BASE_PATH}}">Index</a>
          <a href="{{SITE_BASE_PATH}}algorithm-templates/" aria-current="page">Algorithm Templates</a>
        </nav>
        <div class="header-actions">
          <a class="main-site-link" href="{{MAIN_SITE_URL}}" target="_blank" rel="noopener noreferrer">Personal site ↗</a>
          <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><span aria-hidden="true">☼</span></button>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero hero--index">
        <div>
          <p class="eyebrow">LeetCode / Interview</p>
          <h1>算法模板速查</h1>
        </div>
        <div class="hero-actions">
          <label class="search-box" for="template-search">
            <span>Search</span>
            <input id="template-search" type="search" placeholder="Sliding window, DSU, LIS, Hot100 3..." autocomplete="off" />
          </label>
          <div class="hero-commands">
            <button id="reset-filters" class="ghost-button" type="button">All templates</button>
            <a id="download-page" class="download-button" href="#" role="button">Download site ZIP</a>
          </div>
        </div>
      </section>

      <section class="layout">
        <aside class="sidebar" aria-label="模板分类">
          <div class="sidebar-title">Categories</div>
          <div id="category-list" class="category-list"></div>
        </aside>

        <section class="content-area" aria-live="polite">
          <div class="result-bar">
            <div>
              <strong id="result-count">0</strong>
              <span>templates</span>
            </div>
            <div id="active-filter" class="active-filter">All categories</div>
          </div>
          <div id="template-list" class="template-list"></div>
          <div id="empty-state" class="empty-state" hidden>
            No templates found. Try another keyword or select All templates.
          </div>
        </section>
      </section>
    </main>

    <script src="./assets/jszip.min.js"></script>
    <script src="./assets/index-data.js"></script>
    <script src="./assets/app.js"></script>
  </body>
</html>
